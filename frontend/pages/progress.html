<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Processing – CareerMyntra</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f4ff; min-height: 100vh; color: #0d1b3e; }

    /* NAVBAR */
    .navbar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
    }
    .nav-left img { height: 42px; object-fit: contain; }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .user-chip {
      display: flex; align-items: center; gap: 8px;
      background: #f0f4ff; border: 1px solid #dbeafe;
      border-radius: 24px; padding: 5px 14px 5px 6px;
    }
    .user-avatar {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, #1565c0, #0d47a1);
      color: #fff; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800;
    }
    .user-chip span { font-size: 13px; font-weight: 700; color: #1565c0; }

    /* PAGE */
    .page {
      display: flex; align-items: center; justify-content: center;
      min-height: calc(100vh - 64px); padding: 32px 20px;
    }

    /* CARD */
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 44px 40px;
      width: 540px;
      max-width: 100%;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 32px rgba(21,101,192,0.08);
      text-align: center;
    }

    .course-icon {
      font-size: 56px;
      margin-bottom: 12px;
      display: block;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    .course-name { font-size: 22px; font-weight: 800; color: #0d1b3e; margin-bottom: 6px; }
    .file-name   { font-size: 13px; color: #6b7280; margin-bottom: 32px; }
    .file-name span {
      background: #f0f4ff; border: 1px solid #dbeafe;
      padding: 3px 10px; border-radius: 20px;
      font-weight: 600; color: #1565c0;
    }

    /* PROGRESS BAR */
    .progress-wrap {
      background: #e5e7eb;
      border-radius: 50px;
      height: 14px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 50px;
      background: linear-gradient(90deg, #1565c0, #16a34a);
      transition: width 0.5s ease;
      position: relative;
      overflow: hidden;
    }
    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      animation: shimmer 1.5s infinite;
    }
    /* Hide shimmer when complete */
    .progress-fill.done::after { display: none; }

    @keyframes shimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .progress-stats {
      display: flex; justify-content: space-between;
      font-size: 13px; font-weight: 700; color: #374151;
      margin-bottom: 28px;
    }
    .progress-stats .pct { color: #1565c0; font-size: 15px; }

    /* STATUS STEPS */
    .steps { display: flex; flex-direction: column; gap: 10px; text-align: left; margin-bottom: 28px; }

    .step {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      background: #f9fafb;
      border: 1.5px solid #e5e7eb;
      color: #9ca3af;
      transition: background 0.35s, border-color 0.35s, color 0.35s;
    }
    .step.active {
      background: #eff4ff;
      border-color: #bfdbfe;
      color: #1565c0;
    }
    .step.done {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #15803d;
    }

    .step-icon { font-size: 18px; width: 28px; text-align: center; flex-shrink: 0; }

    .step-spinner {
      width: 18px; height: 18px;
      border: 2.5px solid #bfdbfe;
      border-top-color: #1565c0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* LIVE MESSAGE */
    .current-msg {
      font-size: 13px;
      color: #6b7280;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 500;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.3s;
    }

    /* ERROR STATE */
    .error-box {
      display: none;
      background: #fef2f2;
      border: 1.5px solid #fecaca;
      border-radius: 12px;
      padding: 16px 20px;
      color: #b91c1c;
      font-size: 14px;
      font-weight: 600;
      margin-top: 16px;
    }
    .btn-retry {
      margin-top: 16px;
      padding: 10px 28px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-retry:hover { background: #dc2626; }

    @media (max-width: 600px) {
      .navbar { padding: 0 16px; }
      .user-chip span { display: none; }
      .page { padding: 20px 14px; }
      .card { padding: 28px 20px; border-radius: 18px; }
      .course-icon { font-size: 44px; }
      .course-name { font-size: 18px; }
      .steps { gap: 8px; }
      .step { padding: 10px 12px; font-size: 13px; }
      .progress-stats { font-size: 12px; }
      .current-msg { font-size: 12px; padding: 8px 12px; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-left">
      <img src="../images/logo.jpeg" alt="CareerMyntra"/>
    </div>
    <div class="nav-right">
      <div class="user-chip">
        <div class="user-avatar">U</div>
<span>User</span>
      </div>
    </div>
  </nav>

  <div class="page">
    <div class="card">
      <span class="course-icon" id="course-icon">⚙️</span>
      <div class="course-name" id="course-name">Engineering</div>
      <div class="file-name">📎 <span id="file-name">file.pdf</span></div>

      <!-- PROGRESS BAR -->
      <div class="progress-wrap">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-stats">
        <span id="eta">Starting...</span>
        <span class="pct" id="pct-text">0%</span>
      </div>

      <!-- STEPS -->
      <div class="steps">
        <div class="step" id="step-1">
          <span class="step-icon">📤</span>
          <span class="step-label">Uploading file</span>
        </div>
        <div class="step" id="step-2">
          <span class="step-icon">📖</span>
          <span class="step-label">Reading file</span>
        </div>
        <div class="step" id="step-3">
          <span class="step-icon">⚙️</span>
          <span class="step-label">Processing data</span>
        </div>
        <div class="step" id="step-4">
          <span class="step-icon">📊</span>
          <span class="step-label">Generating Excel</span>
        </div>
        <div class="step" id="step-5">
          <span class="step-icon">✅</span>
          <span class="step-label">Completed</span>
        </div>
      </div>

      <!-- LIVE MESSAGE -->
      <div class="current-msg" id="current-msg">Preparing...</div>

      <!-- ERROR -->
      <div class="error-box" id="error-box">
        ❌ <span id="error-msg">Something went wrong.</span>
        <br/>
        <button class="btn-retry" onclick="window.location.href='../index.html'">← Go Back</button>
      </div>
    </div>
  </div>

  <script>
    // ── Get data from sessionStorage ──
    const course   = sessionStorage.getItem("course")   || "Engineering";
    const icon     = sessionStorage.getItem("icon")     || "⚙️";
    const filename = sessionStorage.getItem("filename") || "file.pdf";
    const taskId   = sessionStorage.getItem("task_id");

    document.getElementById("course-name").textContent = course;
    document.getElementById("course-icon").textContent = icon;
    document.getElementById("file-name").textContent   = filename;

  

// Badlo:
    const BACKEND = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
  ? "http://localhost:5000"
  : "https://edtechmyntra.com";

    // Attaches the JWT token to every backend call; redirects to login if missing/invalid.
    async function authFetch(url, options = {}) {
      const token = localStorage.getItem("cm_token");
      if (!token) {
        window.location.href = "../login.html";
        return Promise.reject(new Error("No token"));
      }
      options.headers = { ...(options.headers || {}), "Authorization": "Bearer " + token };
      const res = await fetch(url, options);
      if (res.status === 401) {
        localStorage.removeItem("cm_token");
        window.location.href = "../login.html";
        return Promise.reject(new Error("Unauthorized"));
      }
      return res;
    }
    // Each step becomes active when pct >= min, done wh
    // en pct >= max


    const stepRanges = [
      { id: "step-1", origIcon: "📤", min: 0,  max: 15  },
      { id: "step-2", origIcon: "📖", min: 15, max: 30  },
      { id: "step-3", origIcon: "⚙️", min: 30, max: 75  },
      { id: "step-4", origIcon: "📊", min: 75, max: 95  },
      { id: "step-5", origIcon: "✅", min: 95, max: 100 },
    ];

    // Track which steps have been activated / completed already
    // to avoid DOM thrashing on every poll tick
    const stepState = {};  // { "step-1": "idle" | "active" | "done" }
    stepRanges.forEach(s => { stepState[s.id] = "idle"; });

    function updateSteps(pct) {
      stepRanges.forEach(({ id, origIcon, min, max }) => {
        const el      = document.getElementById(id);
        const iconEl  = el.querySelector(".step-icon");
        const current = stepState[id];

        if (pct >= max) {
          // ── DONE ──
          if (current !== "done") {
            stepState[id] = "done";
            el.classList.remove("active");
            el.classList.add("done");
            // Remove spinner if present
            const spinner = el.querySelector(".step-spinner");
            if (spinner) spinner.remove();
            iconEl.style.display = "";
            iconEl.textContent   = "✅";
          }

        } else if (pct >= min) {
          // ── ACTIVE ──
          if (current !== "active") {
            stepState[id] = "active";
            el.classList.remove("done");
            el.classList.add("active");
            // Add spinner only once
            if (!el.querySelector(".step-spinner")) {
              const spinner     = document.createElement("div");
              spinner.className = "step-spinner";
              el.insertBefore(spinner, iconEl);
              iconEl.style.display = "none";
            }
          }

        } else {
          // ── IDLE ──
          if (current !== "idle") {
            stepState[id] = "idle";
            el.classList.remove("active", "done");
            const spinner = el.querySelector(".step-spinner");
            if (spinner) spinner.remove();
            iconEl.style.display = "";
            iconEl.textContent   = origIcon;
          }
        }
      });
    }

    function updateUI(pct, message, status) {
      const fillEl = document.getElementById("progress-fill");
      fillEl.style.width = pct + "%";

      // Remove shimmer once fully done
      if (pct >= 100) fillEl.classList.add("done");

      document.getElementById("pct-text").textContent  = pct + "%";
      document.getElementById("current-msg").textContent = message;

      // ETA: rough estimate based on % remaining (0.4s per %)
      const remaining = Math.max(0, Math.ceil((100 - pct) * 0.4));
      document.getElementById("eta").textContent = pct < 100
        ? `⏱ Est. ${remaining}s remaining`
        : "✅ Complete!";

      updateSteps(pct);

      // Redirect is handled in pollProgress after sessionStorage is set
      // (removed from here to avoid race condition)

      if (status === "error") {
        document.getElementById("error-box").style.display = "block";
        document.getElementById("error-msg").textContent   = message;
        document.getElementById("current-msg").style.color = "#b91c1c";
      }
    }

    // ── Poll backend every 1.5 seconds ──
    function pollProgress() {
      if (!taskId) {
        simulateDemo();
        return;
      }

      let isPolling = true;

      const interval = setInterval(async () => {
        if (!isPolling) return;

        try {
          const res = await authFetch(`${BACKEND}/api/progress/${taskId}`);
          const data = await res.json();

          if (data.success) {
            updateUI(data.percent, data.message, data.status);

            if (data.status === "completed") {
              isPolling = false;
              clearInterval(interval);
              // Store output info BEFORE redirect
              sessionStorage.setItem("records",     data.records     || 0);
              sessionStorage.setItem("output_file", data.output_file || "");
              sessionStorage.setItem("course",      course);
              console.log("[SUCCESS] output_file:", data.output_file);
              console.log("[SUCCESS] records:",     data.records);
              // Redirect after sessionStorage is confirmed written
              setTimeout(() => {
                window.location.href = "download.html";
              }, 800);
            }

            if (data.status === "error") {
              isPolling = false;
              clearInterval(interval);
            }
          }
        } catch (err) {
          console.error("Poll error:", err);
          // Don't stop polling on transient network error — retry next tick
        }
      }, 1500);
    }

    // ── Demo mode (no backend / no taskId) ──
    function simulateDemo() {
      const steps = [
        { pct: 10,  msg: "📤 Uploading file...",      status: "processing" },
        { pct: 25,  msg: "📖 Reading PDF pages...",   status: "processing" },
        { pct: 50,  msg: "⚙️ Extracting tables...",   status: "processing" },
        { pct: 75,  msg: "📊 Building Excel rows...", status: "processing" },
        { pct: 90,  msg: "🎨 Formatting output...",   status: "processing" },
        { pct: 100, msg: "✅ Done! 1250 records.",     status: "completed"  },
      ];
      let i = 0;
      const iv = setInterval(() => {
        if (i >= steps.length) { clearInterval(iv); return; }
        const s = steps[i++];
        updateUI(s.pct, s.msg, s.status);
        if (s.status === "completed") {
          sessionStorage.setItem("records",     "1250");
          sessionStorage.setItem("output_file", "engineering_demo_output.xlsx");
          clearInterval(iv);
        }
      }, 1400);
    }

    // ── Start ──
    pollProgress();
  </script>
</body>
</html>
