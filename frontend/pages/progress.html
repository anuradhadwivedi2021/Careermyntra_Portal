<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Processing – CareerMyntra</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f4ff; min-height: 100vh; color: #0d1b3e; }

    /* NAVBAR */
    .navbar { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 32px; height: 64px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 8px rgba(0,0,0,0.06); }
    .nav-left img { height: 42px; object-fit: contain; }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .user-chip { display: flex; align-items: center; gap: 8px; background: #f0f4ff; border: 1px solid #dbeafe; border-radius: 24px; padding: 5px 14px 5px 6px; }
    .user-avatar { width: 30px; height: 30px; background: linear-gradient(135deg, #1565c0, #0d47a1); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; }
    .user-chip span { font-size: 13px; font-weight: 700; color: #1565c0; }

    /* PAGE */
    .page { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 64px); padding: 32px 20px; }

    /* CARD */
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 44px 40px;
      width: 540px;
      max-width: 100%;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 32px rgba(21,101,192,0.08);
      text-align: center;
    }

    .course-icon { font-size: 56px; margin-bottom: 12px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

    .course-name { font-size: 22px; font-weight: 800; color: #0d1b3e; margin-bottom: 6px; }
    .file-name { font-size: 13px; color: #6b7280; margin-bottom: 32px; }
    .file-name span { background: #f0f4ff; border: 1px solid #dbeafe; padding: 3px 10px; border-radius: 20px; font-weight: 600; color: #1565c0; }

    /* PROGRESS BAR */
    .progress-wrap {
      background: #e5e7eb;
      border-radius: 50px;
      height: 14px;
      overflow: hidden;
      margin-bottom: 10px;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 50px;
      background: linear-gradient(90deg, #1565c0, #16a34a);
      transition: width 0.4s ease;
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

    .progress-stats { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: #374151; margin-bottom: 28px; }
    .progress-stats .pct { color: #1565c0; font-size: 15px; }

    /* STATUS STEPS */
    .steps { display: flex; flex-direction: column; gap: 10px; text-align: left; margin-bottom: 28px; }

    .step {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      background: #f9fafb;
      border: 1.5px solid #e5e7eb;
      color: #9ca3af;
      transition: all 0.35s;
    }

    .step.active {
      background: #eff4ff;
      border-color: #bfdbfe;
      color: #1565c0;
    }

    .step.done {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #15803d;
    }

    .step-icon { font-size: 18px; width: 28px; text-align: center; flex-shrink: 0; }

    .step-spinner {
      width: 18px; height: 18px;
      border: 2.5px solid #bfdbfe;
      border-top-color: #1565c0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* CURRENT MESSAGE */
    .current-msg {
      font-size: 13px;
      color: #6b7280;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 500;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ERROR STATE */
    .error-box {
      display: none;
      background: #fef2f2;
      border: 1.5px solid #fecaca;
      border-radius: 12px;
      padding: 16px 20px;
      color: #b91c1c;
      font-size: 14px;
      font-weight: 600;
      margin-top: 16px;
    }

    .btn-retry {
      margin-top: 16px;
      padding: 10px 28px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-retry:hover { background: #dc2626; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-left">
      <img src="../images/logo.jpeg" alt="CareerMyntra"/>
    </div>
    <div class="nav-right">
      <div class="user-chip">
        <div class="user-avatar">A</div>
        <span>Anuradha</span>
      </div>
    </div>
  </nav>

  <div class="page">
    <div class="card">
      <div class="course-icon" id="course-icon">⚙️</div>
      <div class="course-name" id="course-name">Engineering</div>
      <div class="file-name">📎 <span id="file-name">file.pdf</span></div>

      <!-- PROGRESS BAR -->
      <div class="progress-wrap">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-stats">
        <span id="eta">Starting...</span>
        <span class="pct" id="pct-text">0%</span>
      </div>

      <!-- STEPS -->
      <div class="steps">
        <div class="step" id="step-1"><span class="step-icon">📤</span> Uploading file</div>
        <div class="step" id="step-2"><span class="step-icon">📖</span> Reading file</div>
        <div class="step" id="step-3"><span class="step-icon">⚙️</span> Processing data</div>
        <div class="step" id="step-4"><span class="step-icon">📊</span> Generating Excel</div>
        <div class="step" id="step-5"><span class="step-icon">✅</span> Completed</div>
      </div>

      <!-- LIVE MESSAGE -->
      <div class="current-msg" id="current-msg">Preparing...</div>

      <!-- ERROR -->
      <div class="error-box" id="error-box">
        ❌ <span id="error-msg">Something went wrong.</span>
        <br/>
        <button class="btn-retry" onclick="window.location.href='../index.html'">← Go Back</button>
      </div>
    </div>
  </div>

  <script>
    // ── Get data from sessionStorage ──
    const course   = sessionStorage.getItem("course")   || "Engineering";
    const icon     = sessionStorage.getItem("icon")     || "⚙️";
    const filename = sessionStorage.getItem("filename") || "file.pdf";
    const taskId   = sessionStorage.getItem("task_id");

    document.getElementById("course-name").textContent = course;
    document.getElementById("course-icon").textContent = icon;
    document.getElementById("file-name").textContent   = filename;

    const BACKEND = "http://localhost:5000";

    // ── Step thresholds ──
    const stepRanges = [
      { step: "step-1", min: 0,  max: 15  },
      { step: "step-2", min: 15, max: 30  },
      { step: "step-3", min: 30, max: 75  },
      { step: "step-4", min: 75, max: 95  },
      { step: "step-5", min: 95, max: 100 },
    ];

    function updateSteps(pct) {
      stepRanges.forEach(({ step, min, max }) => {
        const el = document.getElementById(step);
        el.classList.remove("active", "done");
        if (pct >= max) {
          el.classList.add("done");
          el.querySelector(".step-icon").textContent = "✅";
        } else if (pct >= min) {
          el.classList.add("active");
          // Add spinner to active step
          const ico = el.querySelector(".step-icon");
          if (!el.querySelector(".step-spinner")) {
            const spinner = document.createElement("div");
            spinner.className = "step-spinner";
            el.insertBefore(spinner, ico);
            ico.style.display = "none";
          }
        }
      });
    }

    function updateUI(pct, message, status) {
      document.getElementById("progress-fill").style.width = pct + "%";
      document.getElementById("pct-text").textContent = pct + "%";
      document.getElementById("current-msg").textContent = message;
      const remaining = Math.max(0, Math.ceil((100 - pct) * 0.4));
      document.getElementById("eta").textContent = pct < 100
        ? `⏱ Est. ${remaining}s remaining`
        : "✅ Complete!";
      updateSteps(pct);

      if (status === "completed") {
        setTimeout(() => {
          window.location.href = "download.html";
        }, 1200);
      }

      if (status === "error") {
        document.getElementById("error-box").style.display = "block";
        document.getElementById("error-msg").textContent = message;
      }
    }

    // ── Poll backend every 1 second ──
    function pollProgress() {
      if (!taskId) {
        // Demo mode — no backend
        simulateDemo();
        return;
      }

      const interval = setInterval(async () => {
        try {
          const res  = await fetch(`${BACKEND}/api/progress/${taskId}`);
          const data = await res.json();

          if (data.success) {
            updateUI(data.percent, data.message, data.status);
            if (data.status === "completed") {
              // ✅ FIX: Store output_file and records BEFORE redirecting
              sessionStorage.setItem("records", data.records || 0);
              sessionStorage.setItem("output_file", data.output_file || "");
              sessionStorage.setItem("course", course);
              console.log("[SUCCESS] Stored output_file:", data.output_file);
              console.log("[SUCCESS] Stored records:", data.records);
              clearInterval(interval);
            }
            if (data.status === "error") {
              clearInterval(interval);
            }
          }
        } catch (err) {
          console.error("Poll error:", err);
        }
      }, 1000);
    }

    // ── Demo mode (no backend) ──
    function simulateDemo() {
      const steps = [
        { pct: 10,  msg: "📤 Uploading file...",      status: "processing" },
        { pct: 25,  msg: "📖 Reading PDF pages...",   status: "processing" },
        { pct: 50,  msg: "⚙️ Extracting tables...",   status: "processing" },
        { pct: 75,  msg: "📊 Building Excel rows...", status: "processing" },
        { pct: 90,  msg: "🎨 Formatting output...",   status: "processing" },
        { pct: 100, msg: "✅ Done! 1250 records.",     status: "completed"  },
      ];
      let i = 0;
      const iv = setInterval(() => {
        if (i >= steps.length) { clearInterval(iv); return; }
        const s = steps[i++];
        updateUI(s.pct, s.msg, s.status);
        if (s.status === "completed") {
          // Demo mode: set mock data
          sessionStorage.setItem("records", "1250");
          sessionStorage.setItem("output_file", "engineering_demo_output.xlsx");
          clearInterval(iv);
        }
      }, 1400);
    }

    // ── Start ──
    pollProgress();
  </script>
</body>
</html>
