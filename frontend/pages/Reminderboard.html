<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deadline Board – CareerMyntra</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f4ff; min-height: 100vh; color: #0d1b3e; }

    /* ── NAVBAR ── */
    .navbar {
      background: #fff; border-bottom: 1px solid #e5e7eb;
      padding: 0 32px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
    }
    .nav-left { display: flex; align-items: center; gap: 12px; }
    .nav-left img { height: 42px; object-fit: contain; }
    .nav-back {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 700; color: #6b7280;
      text-decoration: none; padding: 6px 12px;
      border-radius: 8px; transition: background 0.2s;
    }
    .nav-back:hover { background: #f0f4ff; color: #1565c0; }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .live-clock {
      font-size: 13px; font-weight: 800; color: #1565c0;
      background: #f0f4ff; border: 1px solid #dbeafe;
      border-radius: 20px; padding: 7px 16px;
      font-variant-numeric: tabular-nums;
    }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(135deg, #1565c0 0%, #0d47a1 60%, #0a2f7a 100%);
      padding: 40px 32px 48px; text-align: center;
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: ''; position: absolute; width: 400px; height: 400px; border-radius: 50%;
      background: rgba(255,255,255,0.04); top: -180px; right: -80px;
    }
    .hero::after {
      content: ''; position: absolute; width: 280px; height: 280px; border-radius: 50%;
      background: rgba(255,255,255,0.03); bottom: -100px; left: -60px;
    }
    .hero-badge {
      display: inline-block; background: rgba(105,240,174,0.15);
      border: 1px solid rgba(105,240,174,0.3); color: #69f0ae;
      font-size: 12px; font-weight: 700; padding: 5px 14px;
      border-radius: 20px; margin-bottom: 14px; letter-spacing: 0.5px;
      position: relative; z-index: 2;
    }
    .hero h1 { font-size: 30px; font-weight: 800; color: #fff; margin-bottom: 8px; position: relative; z-index: 2; }
    .hero p { font-size: 14px; color: rgba(255,255,255,0.7); max-width: 480px; margin: 0 auto 24px; line-height: 1.6; position: relative; z-index: 2; }
    .hero-stats { display: flex; justify-content: center; gap: 32px; position: relative; z-index: 2; }
    .hero-stat { text-align: center; }
    .hero-stat strong { display: block; font-size: 22px; font-weight: 800; color: #fff; }
    .hero-stat span { font-size: 12px; color: rgba(255,255,255,0.6); font-weight: 500; }

    /* ── LAYOUT ── */
    .page-wrap { max-width: 1000px; margin: 0 auto; padding: 28px 24px; }

    /* ── TABS ── */
    .tab-row { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
    .tab {
      padding: 9px 20px; border-radius: 24px; font-size: 13px; font-weight: 700;
      cursor: pointer; border: 2px solid #e5e7eb; background: #fff; color: #6b7280;
      transition: all 0.2s; font-family: inherit; display: flex; align-items: center; gap: 6px;
    }
    .tab.active { background: linear-gradient(135deg, #1565c0, #0d47a1); color: #fff; border-color: transparent; box-shadow: 0 4px 14px rgba(21,101,192,0.3); }
    .tab:hover:not(.active) { border-color: #1565c0; color: #1565c0; }
    .tab-count { background: rgba(255,255,255,0.25); padding: 1px 7px; border-radius: 10px; font-size: 11px; }
    .tab:not(.active) .tab-count { background: #f0f4ff; color: #1565c0; }

    /* ── CARD ── */
    .card {
      background: #fff; border-radius: 16px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 20px rgba(21,101,192,0.06);
      overflow: hidden;
    }

    /* ── BOARD ROWS ── */
    .board-row {
      display: grid;
      grid-template-columns: 48px 1fr 1.5fr 170px 110px;
      align-items: center;
      gap: 16px;
      padding: 16px 22px;
      border-bottom: 1px solid #f3f4f6;
      transition: background 0.15s;
    }
    .board-row:last-child { border-bottom: none; }
    .board-row:hover { background: #f8faff; }
    .board-row.today { background: #fff8e6; box-shadow: inset 3px 0 0 #f5a623; }
    .board-row.today:hover { background: #fff3d6; }

    .col-sr { font-size: 13px; font-weight: 800; color: #9aa4b8; }
    .col-title { font-size: 14px; font-weight: 700; color: #0d1b3e; }
    .col-title .cat { display: block; font-size: 11.5px; color: #6b7280; font-weight: 500; margin-top: 3px; }
    .col-desc { font-size: 12.5px; color: #6b7280; line-height: 1.5;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    --webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .col-deadline { font-size: 13.5px; font-weight: 700; color: #0d1b3e; }
    .col-deadline .time { display: block; font-size: 11px; color: #9aa4b8; font-weight: 600; margin-top: 2px; }
    .col-status { text-align: right; }

    .badge {
      display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
      padding: 5px 12px; border-radius: 20px; white-space: nowrap;
    }
    .badge.today { background: #f5a623; color: #fff; }
    .badge.soon { background: #fee2e2; color: #dc2626; }
    .badge.later { background: #f0f4ff; color: #1565c0; }
    .badge.expired { background: #f3f4f6; color: #9aa4b8; }

    /* ── EMPTY STATE ── */
    .empty-state { text-align: center; padding: 56px 20px; color: #9aa4b8; }
    .empty-state .icon { font-size: 32px; margin-bottom: 10px; }
    .empty-state div.msg { font-size: 14px; font-weight: 600; }

    @media (max-width: 720px) {
      .board-row { grid-template-columns: 32px 1fr; row-gap: 6px; }
      .col-desc, .col-deadline, .col-status { grid-column: 2; }
      .col-status { text-align: left; }
      .navbar { padding: 0 16px; }
      .nav-back { padding: 5px 8px; font-size: 12px; }
      .live-clock { font-size: 12px; padding: 6px 12px; }
      .hero { padding: 28px 16px 36px; }
      .hero h1 { font-size: 22px; }
      .hero p { font-size: 13px; }
      .hero-stats { gap: 18px; }
      .hero-stat strong { font-size: 18px; }
      .page-wrap { padding: 20px 14px; }
      .tab { padding: 7px 14px; font-size: 12px; }
      .board-row { padding: 12px 16px; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <img src="../images/logo.jpeg" alt="CareerMyntra" onerror="this.style.display='none'"/>
    <a href="../dashboard.html" class="nav-back">← Dashboard</a>
  </div>
  <div class="nav-right">
    <div class="live-clock" id="live-clock">--:--:--</div>
  </div>
</nav>

<div class="hero">
  <div class="hero-badge">🔔 LIVE</div>
  <h1>Admission Deadline Board</h1>
  <p>All important CAP rounds, form deadlines, and admission dates in one place — sorted by what's coming up next.</p>
  <div class="hero-stats">
    <div class="hero-stat"><strong id="stat-upcoming">0</strong><span>Upcoming</span></div>
    <div class="hero-stat"><strong id="stat-today">0</strong><span>Due Today</span></div>
    <div class="hero-stat"><strong id="stat-archived">0</strong><span>Archived</span></div>
  </div>
</div>

<div class="page-wrap">
  <div class="tab-row">
    <button class="tab active" id="tab-upcoming" onclick="switchBoard('upcoming')">
      📌 Upcoming <span class="tab-count" id="count-upcoming">0</span>
    </button>
    <button class="tab" id="tab-archived" onclick="switchBoard('archived')">
      🗄️ Archived <span class="tab-count" id="count-archived">0</span>
    </button>
  </div>

  <div class="card">
    <div id="board-body"></div>
  </div>
</div>

<script>
  const BACKEND = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
    ? "http://127.0.0.1:5000"
    : "https://edtechmyntra.com";

  const REFRESH_MS = 60000; // 60s auto-refresh
  let currentView = "upcoming";
  let boardData = { upcoming: [], archived: [] };

  function pad(n){ return String(n).padStart(2, "0"); }

  function tickClock(){
    const now = new Date();
    document.getElementById("live-clock").textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }
  setInterval(tickClock, 1000);
  tickClock();
  function fmtDeadline(iso){
    const d = new Date(iso);
    const date = d.toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"numeric" });
    const time = d.toLocaleTimeString("en-IN", { hour:"2-digit", minute:"2-digit" });
    return { date, time };
  }

  function statusBadge(entry, isArchived){
    if (isArchived) return `<span class="badge expired">Expired</span>`;
    if (entry.is_today) return `<span class="badge today">● Today</span>`;
    const days = Math.ceil((new Date(entry.deadline) - new Date()) / 86400000);
    if (days <= 3) return `<span class="badge soon">${days}d left</span>`;
    return `<span class="badge later">${days}d left</span>`;
  }

  function escapeHtml(str){
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  function renderBoard(){
    const list = boardData[currentView] || [];
    const body = document.getElementById("board-body");

    if (!list.length) {
      body.innerHTML = `
        <div class="empty-state">
          <div class="icon">${currentView === "upcoming" ? "🕊️" : "🗄️"}</div>
          <div class="msg">${currentView === "upcoming" ? "No upcoming deadlines right now." : "No archived reminders yet."}</div>
        </div>`;
      return;
    }

    body.innerHTML = list.map((e, i) => {
      const { date, time } = fmtDeadline(e.deadline);
      const isArchived = currentView === "archived";
      return `
        <div class="board-row ${e.is_today && !isArchived ? "today" : ""}">
          <div class="col-sr">${String(i + 1).padStart(2, "0")}</div>
          <div class="col-title">${escapeHtml(e.title)}
            ${e.category ? `<span class="cat">${escapeHtml(e.category)}${e.subcategory ? " · " + escapeHtml(e.subcategory) : ""}</span>` : ""}
          </div>
          <div class="col-desc">${escapeHtml(e.description || "—")}</div>
          <div class="col-deadline">${date}<span class="time">${time}</span></div>
          <div class="col-status">${statusBadge(e, isArchived)}</div>
        </div>`;
    }).join("");
  }

  function switchBoard(view){
    currentView = view;
    document.getElementById("tab-upcoming").classList.toggle("active", view === "upcoming");
    document.getElementById("tab-archived").classList.toggle("active", view === "archived");
    renderBoard();
  }

  async function loadBoard(){
    try {
      const res = await fetch(`${BACKEND}/api/reminders/board`);
      const json = await res.json();
      const data = json.data || json;
      boardData.upcoming = data.upcoming || [];
      boardData.archived = data.archived || [];

      document.getElementById("count-upcoming").textContent = boardData.upcoming.length;
      document.getElementById("count-archived").textContent = boardData.archived.length;
      document.getElementById("stat-upcoming").textContent = boardData.upcoming.length;
      document.getElementById("stat-archived").textContent = boardData.archived.length;
      document.getElementById("stat-today").textContent = boardData.upcoming.filter(e => e.is_today).length;

      renderBoard();
    } catch (e) {
      document.getElementById("board-body").innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <div class="msg">Could not load the deadline board. Retrying shortly…</div>
        </div>`;
    }
  }
  loadBoard();
  setInterval(loadBoard, REFRESH_MS);
</script>
</body>
</html>
