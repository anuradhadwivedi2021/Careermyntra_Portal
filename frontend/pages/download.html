<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Download – CareerMyntra</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f4ff; min-height: 100vh; color: #0d1b3e; }

    /* NAVBAR */
    .navbar { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 32px; height: 64px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 8px rgba(0,0,0,0.06); }
    .nav-left img { height: 42px; object-fit: contain; }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .nav-link { font-size: 13px; font-weight: 600; color: #374151; text-decoration: none; padding: 6px 12px; border-radius: 8px; transition: background 0.2s; }
    .nav-link:hover { background: #f0f4ff; color: #1565c0; }
    .user-chip { display: flex; align-items: center; gap: 8px; background: #f0f4ff; border: 1px solid #dbeafe; border-radius: 24px; padding: 5px 14px 5px 6px; }
    .user-avatar { width: 30px; height: 30px; background: linear-gradient(135deg, #1565c0, #0d47a1); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; }
    .user-chip span { font-size: 13px; font-weight: 700; color: #1565c0; }

    /* PAGE */
    .page { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 64px); padding: 32px 20px; }

    /* CARD */
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 48px 40px;
      width: 520px;
      max-width: 100%;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 32px rgba(21,101,192,0.08);
      text-align: center;
    }

    /* SUCCESS ANIMATION */
    .success-circle {
      width: 90px; height: 90px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin: 0 auto 20px;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 8px 24px rgba(22,163,74,0.3);
    }

    @keyframes popIn {
      0%   { transform: scale(0); opacity: 0; }
      80%  { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .success-title { font-size: 24px; font-weight: 800; color: #15803d; margin-bottom: 8px; }
    .success-sub { font-size: 14px; color: #6b7280; margin-bottom: 32px; line-height: 1.6; }

    /* INFO TABLE */
    .info-table {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 28px;
      text-align: left;
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .label { color: #6b7280; font-weight: 600; display: flex; align-items: center; gap: 7px; }
    .info-row .value { font-weight: 700; color: #0d1b3e; }
    .info-row .value.green { color: #15803d; }
    .info-row .value.blue  { color: #1565c0; }

    /* BUTTONS */
    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      transition: all 0.2s;
      margin-bottom: 12px;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 16px rgba(22,163,74,0.25);
    }
    .btn-download:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(22,163,74,0.35); }
    .btn-download:active { transform: scale(0.98); }
    .btn-download:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-new {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background: #fff;
      color: #1565c0;
      border: 2px solid #dbeafe;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-new:hover { background: #eff4ff; border-color: #1565c0; }

    /* CONFETTI */
    .confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 999; overflow: hidden; }
    .confetti-piece {
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 2px;
      animation: fall linear forwards;
      top: -20px;
    }
    @keyframes fall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* LOADING SPINNER */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(21,163,74,0.3);
      border-top-color: #16a34a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .navbar { padding: 0 16px; }
      .nav-link { font-size: 12px; padding: 5px 8px; }
      .user-chip span { display: none; }
      .page { padding: 20px 14px; }
      .card { padding: 32px 20px; border-radius: 18px; }
      .success-circle { width: 70px; height: 70px; font-size: 32px; }
      .success-title { font-size: 20px; }
      .success-sub { font-size: 13px; margin-bottom: 24px; }
      .info-row { padding: 11px 14px; font-size: 13px; flex-wrap: wrap; gap: 4px; }
      .btn-download, .btn-new { font-size: 14px; padding: 12px; }
    }
  </style>
</head>
<body>

  <!-- CONFETTI -->
  <div class="confetti-wrap" id="confetti"></div>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-left">
      <img src="../images/logo.jpeg" alt="CareerMyntra"/>
    </div>
    <div class="nav-right">
      <a href="../index.html" class="nav-link">← Dashboard</a>
      <div class="user-chip">
       <div class="user-avatar">U</div>
<span>User</span>
      </div>
    </div>
  </nav>

  <div class="page">
    <div class="card">
      <div class="success-circle">✅</div>
      <div class="success-title">Processing Complete!</div>
      <div class="success-sub">Your Excel output is ready to download.<br/>All records have been extracted successfully.</div>

      <!-- INFO TABLE -->
      <div class="info-table">
        <div class="info-row">
          <span class="label">🎓 Course</span>
          <span class="value blue" id="dl-course">Engineering</span>
        </div>
        <div class="info-row">
          <span class="label">📊 Records Extracted</span>
          <span class="value green" id="dl-records">—</span>
        </div>
        <div class="info-row">
          <span class="label">📄 Output File</span>
          <span class="value" id="dl-filename">
            <span class="spinner"></span> Loading...
          </span>
        </div>
        <div class="info-row">
          <span class="label">🕒 Generated At</span>
          <span class="value" id="dl-time">—</span>
        </div>
        <div class="info-row">
          <span class="label">📁 Format</span>
          <span class="value">Excel (.xlsx)</span>
        </div>
      </div>

      <!-- BUTTONS -->
      <a class="btn-download" id="download-btn" href="#" onclick="downloadFile(event)">
        ⬇️ Download Excel File
      </a>
      <a class="btn-new" href="../index.html">
        🔄 Process Another File
      </a>
    </div>
  </div>

  <script>

   const BACKEND = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
  ? "http://localhost:5000"

 : "https://edtechmyntra.com";

    // ✅ FIX: Initialize with empty values, update as soon as data is available
    let course     = sessionStorage.getItem("course")      || "Engineering";
    let records    = sessionStorage.getItem("records")     || "—";
    let outputFile = sessionStorage.getItem("output_file") || "";

    // Set initial values
    document.getElementById("dl-course").textContent   = course;
    document.getElementById("dl-records").textContent  = records ? `${records} rows` : "—";
    document.getElementById("dl-time").textContent     = new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

    // ✅ FIX: Poll for output_file if not immediately available
    function waitForOutputFile() {
      return new Promise((resolve) => {
        let attempts = 0;
        const maxAttempts = 50; // 5 seconds max
        
        const checkInterval = setInterval(() => {
          const file = sessionStorage.getItem("output_file");
          attempts++;
          
          if (file) {
            console.log("[SUCCESS] Got output_file from sessionStorage:", file);
            clearInterval(checkInterval);
            resolve(file);
          } else if (attempts >= maxAttempts) {
            console.warn("[TIMEOUT] Could not get output_file after 5 seconds");
            clearInterval(checkInterval);
            resolve(null);
          }
        }, 100);
      });
    }

    // Update filename as soon as it's available
    (async () => {
      const file = await waitForOutputFile();
      if (file) {
        outputFile = file;
        document.getElementById("dl-filename").textContent = file;
        document.getElementById("download-btn").disabled = false;
        console.log("[UI] Updated filename to:", file);
      } else {
        document.getElementById("dl-filename").textContent = "output.xlsx (fallback)";
        document.getElementById("download-btn").disabled = true;
        document.getElementById("download-btn").textContent = "⚠️ File not ready — go back and retry";
        console.error("[ERROR] No output file found in sessionStorage");
        // Show a helpful message to the user
        const sub = document.querySelector(".success-sub");
        if (sub) sub.innerHTML = "⚠️ Output file not found. Processing may have been interrupted.<br/>Please go back and re-upload the file.";
      }
    })();

    async function downloadFile(e) {
      e.preventDefault();

      if (!outputFile) {
        alert("❌ Output file not found. Please check that:\n\n1. Backend is running\n2. File processing completed successfully\n3. Try refreshing the page\n\nIf problem persists, click 'Process Another File' to retry.");
        return;
      }

      const token = localStorage.getItem("cm_token");
      if (!token) { window.location.href = "../login.html"; return; }

      try {
        const res = await fetch(`${BACKEND}/api/download/${outputFile}`, {
          method: "GET",
          headers: { "Authorization": "Bearer " + token }
        });

        if (res.status === 401) {
          localStorage.removeItem("cm_token");
          window.location.href = "../login.html";
          return;
        }
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          alert("❌ Download failed: " + (err.error || res.statusText));
          return;
        }

        const blob = await res.blob();
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href     = url;
        a.download = outputFile;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

      } catch (err) {
        alert("❌ Download error: " + err.message);
      }
    }

    // ── Confetti ──
    function launchConfetti() {
      const colors = ["#1565c0","#16a34a","#f97316","#9333ea","#fbbf24","#ef4444"];
      const wrap   = document.getElementById("confetti");
      for (let i = 0; i < 60; i++) {
        const el = document.createElement("div");
        el.className = "confetti-piece";
        el.style.left     = Math.random() * 100 + "vw";
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.animationDuration = (Math.random() * 2 + 2) + "s";
        el.style.animationDelay   = (Math.random() * 1.5) + "s";
        el.style.width  = (Math.random() * 8 + 6) + "px";
        el.style.height = (Math.random() * 8 + 6) + "px";
        wrap.appendChild(el);
      }
      setTimeout(() => wrap.innerHTML = "", 5000);
    }

    // Add debug info to browser console
    console.log("[DEBUG] Course:", course);
    console.log("[DEBUG] Records:", records);
    console.log("[DEBUG] Output File (initial):", outputFile);
    console.log("[DEBUG] sessionStorage keys:", Object.keys(sessionStorage));

    launchConfetti();
  </script>
</body>
</html>
